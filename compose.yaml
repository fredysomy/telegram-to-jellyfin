name: home-server

services:
  stremio:
    # Stremio web player + streaming server on host port 8090.
    image: tsaridas/stremio-docker:latest
    restart: unless-stopped
    environment:
      NO_CORS: "1"
      AUTO_SERVER_URL: "1"
      WEBUI_LOCATION: "http://192.168.1.7:8090"
    ports:
      - "192.168.1.7:8090:8080"
    volumes:
      - "/home/fredy/Home Server Data/Stremio:/root/.stremio-server"

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "1000:1000"
    init: true
    ports:
      - "192.168.1.7:8096:8096/tcp" # Jellyfin web and clients (LAN only)
      - "192.168.1.7:7359:7359/udp" # LAN discovery
    environment:
      JELLYFIN_PublishedServerUrl: http://192.168.1.7:8096
    volumes:
      - "/home/fredy/Home Server Data/Jellyfin/config:/config"
      - "/home/fredy/Home Server Data/Jellyfin/cache:/cache"
      - "/home/fredy/Media Library:/media:ro"
    stop_grace_period: 30s

  telegram-bot-api:
    build:
      context: .
      dockerfile: bot-api.Dockerfile
      args:
        TELEGRAM_BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    image: home-server/telegram-bot-api:e3e9dd8
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -a
        . /run/secrets/telegram
        set +a
        exec /usr/local/bin/telegram-bot-api \
          --local \
          --http-ip-address=0.0.0.0 \
          --http-port=8081 \
          --dir=/var/lib/telegram-bot-api \
          --temp-dir=/var/lib/telegram-bot-api/temp
    expose:
      - "8081"
    secrets:
      - source: telegram_credentials
        target: telegram
    volumes:
      - "/home/fredy/Home Server Data/Telegram/bot-api:/var/lib/telegram-bot-api"
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  telegram-ingest:
    build:
      context: .
      dockerfile: worker.Dockerfile
    image: home-server/telegram-ingest:1
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    secrets:
      - source: telegram_credentials
        target: telegram
    environment:
      TELEGRAM_SECRETS_FILE: /run/secrets/telegram
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
      BOT_DATA_DIRECTORY: /var/lib/telegram-bot-api
      QUEUE_DATABASE: /state/queue.sqlite3
      PARTIAL_DIRECTORY: /media/Incoming/.partial
      MOVIES_DIRECTORY: /media/Movies
      TV_DIRECTORY: /media/TV Shows
      TORRENT_DROP_DIRECTORY: /media/Incoming/torrents
      DOWNLOAD_DIRECTORY: /media/Incoming/torrent-downloads
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:?set QBITTORRENT_USERNAME in .env}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?set QBITTORRENT_PASSWORD in .env}
      QBITTORRENT_SAVE_PATH: /downloads
      QBITTORRENT_CATEGORY: tv
      # Configured in .env; left empty here so the image carries no endpoint.
      STREAM_SOURCE_URL: ${STREAM_SOURCE_URL:-}
      STREAM_SOURCE_REFERER: ${STREAM_SOURCE_REFERER:-}
      STREAM_SOURCE_USER_AGENT: ${STREAM_SOURCE_USER_AGENT:-}
      DELETE_TORRENT_AFTER_ORGANISE: "true"
      FREE_SPACE_RESERVE_BYTES: "10737418240"
      MAX_ATTEMPTS: "5"
      METADATA_TIMEOUT_SECONDS: "900"
      GET_FILE_RETRY_WINDOW_SECONDS: "1200"
      LOG_LEVEL: INFO
    volumes:
      - "/home/fredy/Home Server Data/Telegram/bot-api:/var/lib/telegram-bot-api:ro"
      - "/home/fredy/Home Server Data/Telegram/state:/state"
      - "/home/fredy/Media Library:/media"
      # Mounted so edits to the torrent source adapter take effect on restart,
      # without rebuilding the image.
      - "./torrent_source.py:/app/torrent_source.py:ro"
    stop_grace_period: 30s

  qbittorrent:
    # Torrent downloader for the Telegram series flow. Web UI is LAN-only on
    # 8095 so it does not collide with Stremio (8090).
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Kolkata
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "192.168.1.7:8095:8080" # Web UI (LAN only)
      - "192.168.1.7:6881:6881" # Peer port (LAN only)
      - "192.168.1.7:6881:6881/udp"
    volumes:
      - "/home/fredy/Home Server Data/qBittorrent:/config"
      - "/home/fredy/Media Library/Incoming/torrent-downloads:/downloads"
    stop_grace_period: 30s

secrets:
  telegram_credentials:
    file: ./telegram-secrets.env
